<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Anió (blau cian) -->
  <circle cx="40" cy="34" r="15" fill="#06b6d4" opacity="0.9" />
  <text x="40" y="39" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
  <!-- Catió (taronja ambre) -->
  <circle cx="21" cy="28" r="10" fill="#f59e0b" />
  <text x="21" y="33" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <!-- Electrón transferit -->
  <circle cx="29" cy="24" r="3" fill="#fde047" />
</svg>