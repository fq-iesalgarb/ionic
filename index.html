<!DOCTYPE html>
<html lang="ca" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enllaç Iònic Interactiu | IES Algarb</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- KaTeX CSS & JS per a renderització matemàtica i química perfecta -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --metal-color: #f59e0b;
      --metal-bg: rgba(245, 158, 11, 0.14);
      --nonmetal-color: #06b6d4;
      --nonmetal-bg: rgba(6, 182, 212, 0.14);
      --orbit-stroke: #94a3b8;
      --vacancy-stroke: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-subtle: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --metal-color: #fbbf24;
      --metal-bg: rgba(251, 191, 36, 0.16);
      --nonmetal-color: #22d3ee;
      --nonmetal-bg: rgba(34, 211, 238, 0.16);
      --orbit-stroke: #64748b;
      --vacancy-stroke: #f87171;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.45;
      transition: background-color 0.25s, color 0.25s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Capçalera institucional compacta */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.65rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-badge {
      background: var(--primary);
      color: white;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand span.subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: inline-block;
      margin-left: 0.5rem;
    }

    .theme-btn {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: var(--primary);
    }

    /* Contenidor principal optimitzat per a PDI */
    main {
      max-width: 1240px;
      width: 100%;
      margin: 0.85rem auto;
      padding: 0 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    /* Selectors d'elements */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      align-items: center;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .select-group label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .label-metal { color: var(--metal-color); }
    .label-nonmetal { color: var(--nonmetal-color); }

    select {
      padding: 0.42rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid var(--primary);
    }

    /* Explicació didàctica amb ALÇADA CONSTANT perquè els botons no es moguin mai */
    .didactic-banner {
      background: var(--bg-card);
      border-left: 5px solid var(--primary);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.65rem 1.1rem;
      box-shadow: var(--shadow);
      height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .didactic-banner h2 {
      font-size: 0.98rem;
      margin-bottom: 0.22rem;
      color: var(--primary);
    }

    .didactic-banner p {
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Zona central: Simulació + Botons de fase al costat */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 245px;
      gap: 0.85rem;
      align-items: stretch;
    }

    @media (max-width: 860px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
      .didactic-banner {
        height: auto;
        min-height: 92px;
      }
    }

    .stage-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem;
      padding: 0.52rem 1rem;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.82rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-metal { background: var(--metal-color); box-shadow: 0 0 6px var(--metal-color); }
    .dot-nonmetal { background: var(--nonmetal-color); box-shadow: 0 0 6px var(--nonmetal-color); }
    .dot-vacancy {
      border: 2px dashed var(--vacancy-stroke);
      background: transparent;
    }

    #bohr-svg {
      width: 100%;
      height: 395px;
      display: block;
    }

    /* Panell lateral de fases integrat al costat de la simulació */
    .phases-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.45rem;
    }

    .phases-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .phase-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      justify-content: center;
    }

    .phase-btn {
      width: 100%;
      text-align: left;
      padding: 0.48rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.18s;
    }

    .phase-btn:hover {
      border-color: var(--primary);
      transform: translateX(2px);
    }

    .phase-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    .phase-btn.completed:not(.active) {
      border-left: 4px solid var(--primary);
    }

    .phase-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .phase-btn.active .phase-num {
      background: rgba(255, 255, 255, 0.25);
    }

    .sidebar-nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding-top: 0.35rem;
      border-top: 1px solid var(--border-color);
    }

    .mini-nav-btn {
      padding: 0.45rem 0.5rem;
      border-radius: 7px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s;
    }

    .mini-nav-btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .mini-nav-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .mini-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Targetes de configuració electrònica */
    .configs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 0.85rem;
    }

    .config-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.75rem 1.1rem;
      box-shadow: var(--shadow);
    }

    .config-card.metal-card { border-top: 4px solid var(--metal-color); }
    .config-card.nonmetal-card { border-top: 4px solid var(--nonmetal-color); }

    .config-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-color);
    }

    .config-title {
      font-weight: 700;
      font-size: 0.96rem;
    }

    .badge-group {
      font-size: 0.78rem;
      padding: 0.18rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
    }

    .metal-card .badge-group { background: var(--metal-bg); color: var(--metal-color); }
    .nonmetal-card .badge-group { background: var(--nonmetal-bg); color: var(--nonmetal-color); }

    .config-row {
      margin: 0.28rem 0;
      font-size: 0.88rem;
    }

    .config-label {
      color: var(--text-muted);
      font-weight: 600;
      display: inline-block;
      min-width: 145px;
    }

    footer {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
      margin-top: 0.8rem;
    }

    @keyframes pulseVacancy {
      0%, 100% { stroke-opacity: 1; transform: scale(1); }
      50% { stroke-opacity: 0.35; transform: scale(1.15); }
    }

    .vacancy-ring {
      animation: pulseVacancy 1.6s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-badge">IES Algarb</span>
      <div>
        <h1>Formació de l'Enllaç Iònic <span class="subtitle">Física i Química · 3r d'ESO</span></h1>
      </div>
    </div>
    <button class="theme-btn" id="theme-toggle" aria-label="Canvia el tema">
      <span id="theme-icon">🌙</span> <span id="theme-text">Mode fosc</span>
    </button>
  </header>

  <main>
    <!-- Selectors d'elements -->
    <section class="controls-panel">
      <div class="select-group">
        <label for="metal-select" class="label-metal">1. Tria un Metall (Grups 1 o 2, Z ≤ 20)</label>
        <select id="metal-select"></select>
      </div>

      <div class="select-group">
        <label for="nonmetal-select" class="label-nonmetal">2. Tria un No-metall (Grups 15, 16 o 17)</label>
        <select id="nonmetal-select"></select>
      </div>
    </section>

    <!-- Explicació didàctica dinàmica amb alçada fixa -->
    <section class="didactic-banner" id="didactic-banner">
      <h2 id="step-title">Carregant...</h2>
      <p id="step-desc"></p>
    </section>

    <!-- Zona principal: Simulació + Botons de fase al costat -->
    <section class="workspace-grid">
      <div class="stage-container">
        <div class="legend-bar">
          <div class="legend-item"><span class="dot dot-metal"></span> Electrons del metall</div>
          <div class="legend-item"><span class="dot dot-nonmetal"></span> Electrons del no-metall</div>
          <div class="legend-item" id="legend-vacancy" style="display:none;"><span class="dot dot-vacancy"></span> Buits a l'última capa (octet)</div>
        </div>
        <svg id="bohr-svg" viewBox="0 0 820 395" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <aside class="phases-sidebar" aria-label="Fases de l'enllaç iònic">
        <div class="phases-title">Fases del procés</div>
        <div class="phase-list" id="phase-list"></div>
        <div class="sidebar-nav-row">
          <button class="mini-nav-btn" id="btn-prev" disabled>⬅ Anterior</button>
          <button class="mini-nav-btn primary" id="btn-next">Següent ➡</button>
        </div>
      </aside>
    </section>

    <!-- Configuracions electròniques -->
    <section class="configs-grid" id="configs-grid"></section>
  </main>

  <footer>
    Departament de Física i Química · <strong>IES Algarb</strong> · Simulació interactiva per a 3r d'ESO
  </footer>

  <script>
    /**
     * Funcions segures d'involucració per a KaTeX
     */
    function mInline(latex) {
      if (window.katex) {
        return katex.renderToString(latex, { throwOnError: false, displayMode: false });
      }
      return latex;
    }

    function mBlock(latex) {
      if (window.katex) {
        return katex.renderToString(latex, { throwOnError: false, displayMode: true });
      }
      return latex;
    }

     * Base de dades d'elements químics
     */

      {

        shortConfig: '[\\text{Ar}]\\,4s^2',
        ionFullConfig: '1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^6',
        ionShortConfig: '[\\text{Ar}]',
        stableRule: 'octet (8\\text{ e}^-)'
      }
    ];

    const NONMETALS = [
      {
        symbol: 'N', name: 'Nitrogen', z: 7, group: 15, period: 2,
        shells: [2, 5], valence: 5, needed: 3, charge: -3,
        fullConfig: '1s^2\\,2s^2\\,2p^3',
        shortConfig: '[\\text{He}]\\,2s^2\\,2p^3',
        ionFullConfig: '1s^2\\,2s^2\\,2p^6',

      },
      {

      {

        shells: [2, 7], valence: 7, needed: 1, charge: -1,
        fullConfig: '1s^2\\,2s^2\\,2p^5',
        shortConfig: '[\\text{He}]\\,2s^2\\,2p^5',
        ionFullConfig: '1s^2\\,2s^2\\,2p^6',
        ionShortConfig: '[\\text{Ne}]'
      },
      {
        symbol: 'P', name: 'Fòsfor', z: 15, group: 15, period: 3,
        shells: [2, 8, 5], valence: 5, needed: 3, charge: -3,

      {

      {

        fullConfig: '1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^6\\,4s^2\\,3d^{10}\\,4p^5',
        shortConfig: '[\\text{Ar}]\\,4s^2\\,3d^{10}\\,4p^5',
        ionFullConfig: '1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^6\\,4s^2\\,3d^{10}\\,4p^6',
        ionShortConfig: '[\\text{Kr}]'
      }
    ];

    const STEPS_META = [
      { id: 1, label: 'Àtoms neutres' },
      { id: 2, label: 'Sobrants i buits' },
      { id: 3, label: 'Proporció d\'àtoms' },
      { id: 4, label: 'Viatge d\'electrons' },
      { id: 5, label: 'Catió i Anió' },
      { id: 6, label: 'Atracció iònica' },
      { id: 7, label: 'Xarxa cristal·lina 3D' }
    ];

    let state = {
      metalIdx: 2,      // Sodi (Na) per defecte
      nonmetalIdx: 5,   // Clor (Cl) per defecte
      step: 1,
      prevStep: 1
    };

    let activeAnimationId = null;

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }
    function lcm(a, b) {
      return (a * b) / gcd(a, b);
    }

    function getStoichiometry(metal, nonmetal) {
      const totalElectrons = lcm(metal.valence, nonmetal.needed);
      const nMetal = totalElectrons / metal.valence;
      const nNonmetal = totalElectrons / nonmetal.needed;
      // Format LaTeX correcte sense guions baixos dins de \text{}
      const formulaLatex = `\\text{${metal.symbol}}${nMetal > 1 ? '_' + nMetal : ''}\\text{${nonmetal.symbol}}${nNonmetal > 1 ? '_' + nNonmetal : ''}`;
      return { nMetal, nNonmetal, totalElectrons, formulaLatex };
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateSelects();
      setupEvents();
      renderAll();
    });

    function populateSelects() {
      const mSel = document.getElementById('metal-select');
      const nmSel = document.getElementById('nonmetal-select');

      METALS.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${m.name} (${m.symbol}) — Z = ${m.z}, Grup ${m.group}`;
        if (idx === state.metalIdx) opt.selected = true;
        mSel.appendChild(opt);
      });

      NONMETALS.forEach((nm, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${nm.name} (${nm.symbol}) — Z = ${nm.z}, Grup ${nm.group}`;
        if (idx === state.nonmetalIdx) opt.selected = true;
        nmSel.appendChild(opt);
      });
    }

    function goToStep(newStep) {
      if (newStep < 1 || newStep > 7) return;
      state.prevStep = state.step;
      state.step = newStep;
      renderAll();
    }

    function setupEvents() {
      document.getElementById('metal-select').addEventListener('change', (e) => {
        state.metalIdx = parseInt(e.target.value, 10);
        state.prevStep = 1;
        state.step = 1;
        renderAll();
      });

      document.getElementById('nonmetal-select').addEventListener('change', (e) => {
        state.nonmetalIdx = parseInt(e.target.value, 10);
        state.prevStep = 1;
        state.step = 1;
        renderAll();
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        goToStep(state.step - 1);
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        goToStep(state.step + 1);
      });

      const themeBtn = document.getElementById('theme-toggle');
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
        document.getElementById('theme-text').textContent = isDark ? 'Mode fosc' : 'Mode clar';
      });
    }

    function renderAll() {
      const metal = METALS[state.metalIdx];
      const nonmetal = NONMETALS[state.nonmetalIdx];
      const stoich = getStoichiometry(metal, nonmetal);

      document.getElementById('btn-prev').disabled = state.step === 1;
      document.getElementById('btn-next').disabled = state.step === 7;

      document.getElementById('legend-vacancy').style.display = (state.step === 2 || state.step === 3) ? 'flex' : 'none';

      renderPhaseButtons();
      renderDidacticText(metal, nonmetal, stoich);
      renderConfigs(metal, nonmetal);
      renderSVG(metal, nonmetal, stoich);
    }

    function renderPhaseButtons() {
      const list = document.getElementById('phase-list');
      list.innerHTML = STEPS_META.map(s => {
        let cls = 'phase-btn';
        if (s.id === state.step) cls += ' active';
        else if (s.id < state.step) cls += ' completed';
        return `<button class="${cls}" data-step="${s.id}">
                  <span class="phase-num">${s.id}</span>
                  <span>${s.label}</span>
                </button>`;
      }).join('');

      list.querySelectorAll('.phase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          goToStep(parseInt(btn.getAttribute('data-step'), 10));
        });
      });
    }

    function renderDidacticText(m, nm, st) {
      const titleEl = document.getElementById('step-title');
      const descEl = document.getElementById('step-desc');

      const s = state.step;
      if (s === 1) {
        titleEl.textContent = `Pas 1: Estat inicial dels àtoms neutres (${m.name} i ${nm.name})`;
        descEl.innerHTML = `Tenim un àtom neutre de <strong>${m.name}</strong> (${mInline(`\\text{${m.symbol}}`)}, grup ${m.group}) amb <strong>${m.valence}</strong> ${m.valence === 1 ? 'electró' : 'electrons'} a la seva capa de valència, i un àtom neutre de <strong>${nm.name}</strong> (${mInline(`\\text{${nm.symbol}}`)}, grup ${nm.group}) amb <strong>${nm.valence}</strong> electrons de valència. Observa les seves configuracions electròniques a la part inferior.`;
      } else if (s === 2) {
        titleEl.textContent = `Pas 2: Quants electrons sobren i quants en falten?`;
        descEl.innerHTML = `Per assolir l'estabilitat de gas noble: al <strong>${m.name}</strong> li <strong>sobren ${m.valence} ${m.valence === 1 ? 'electró' : 'electrons'}</strong> (per quedar-se amb estructura de ${mInline(m.stableRule)}), mentre que al <strong>${nm.name}</strong> li <strong>falten ${nm.needed} ${nm.needed === 1 ? 'electró' : 'electrons'}</strong> (marcats com a buits discontinus) per completar el seu octet.`;
      } else if (s === 3) {
        titleEl.textContent = `Pas 3: Ajust estequiomètric (proporció d'àtoms necessaris)`;
        if (st.nMetal === 1 && st.nNonmetal === 1) {
          descEl.innerHTML = `Com que el ${m.name} cedeix <strong>${m.valence}</strong> ${m.valence === 1 ? 'electró' : 'electrons'} i el ${nm.name} en necessita exactament <strong>${nm.needed}</strong>, el balanç ja és perfecte amb <strong>1 àtom de ${mInline(`\\text{${m.symbol}}`)}</strong> i <strong>1 àtom de ${mInline(`\\text{${nm.symbol}}`)}</strong>!`;
        } else {
          descEl.innerHTML = `Un sol àtom de cada no quadra els comptes! Perquè tots els electrons cedits siguin captats sense que en sobri ni en falti cap (mínim comú múltiple = ${st.totalElectrons} electrons), necessitam <strong>${st.nMetal} ${st.nMetal === 1 ? 'àtom' : 'àtoms'} de ${m.name}</strong> (${st.nMetal} × ${m.valence} = ${st.totalElectrons} e⁻ cedits) i <strong>${st.nNonmetal} ${st.nNonmetal === 1 ? 'àtom' : 'àtoms'} de ${nm.name}</strong> (${st.nNonmetal} × ${nm.needed} = ${st.totalElectrons} e⁻ captats).`;
        }
      } else if (s === 4) {
        titleEl.textContent = `Pas 4: Transferència d'electrons (el "viatge")`;
        descEl.innerHTML = `Els <strong>${st.totalElectrons} ${st.totalElectrons === 1 ? 'electró' : 'electrons'}</strong> de valència del metall (en <span style="color:var(--metal-color);font-weight:700;">taronja ambre</span>) viatgen cap a l'última capa del no-metall, omplint els seus buits al costat dels electrons propis del no-metall (en <span style="color:var(--nonmetal-color);font-weight:700;">blau cian</span>).`;
      } else if (s === 5) {
        const catOx = `${m.charge}+`;
        const anOx = `${Math.abs(nm.charge)}-`;
        titleEl.textContent = `Pas 5: Formació del Catió i l'Anió (Nombres d'oxidació)`;
        descEl.innerHTML = `En cedir ${m.valence} ${m.valence === 1 ? 'electró' : 'electrons'}, cada àtom de metall es transforma en el catió ${mInline(`\\text{${m.symbol}}^{${catOx}}`)} (nombre d'oxidació <strong>${catOx}</strong>). En captar ${nm.needed} ${nm.needed === 1 ? 'electró' : 'electrons'}, cada àtom de no-metall es converteix en l'anió ${mInline(`\\text{${nm.symbol}}^{${anOx}}`)} (nombre d'oxidació <strong>${anOx}</strong>).`;
      } else if (s === 6) {
        const oxM = m.charge;
        const oxNM = Math.abs(nm.charge);
        titleEl.textContent = `Pas 6: Atracció electrostàtica i intercanvi de nombres d'oxidació`;
        descEl.innerHTML = `Els ions de signe contrari s'atreuen. Si intercanviam els seus nombres d'oxidació (${mInline(`\\text{${m.symbol}}^{${oxM}+}`)} i ${mInline(`\\text{${nm.symbol}}^{${oxNM}-}`)}) com a subíndexs creuats (i simplificam si cal), obtenim la fórmula del compost: ${mInline(`\\text{${m.symbol}}_{${oxNM}}\\text{${nm.symbol}}_{${oxM}} \\rightarrow ${st.formulaLatex}`)}.`;
      } else if (s === 7) {
        titleEl.textContent = `Pas 7: Xarxa cristal·lina iònica tridimensional (perspectiva cavallera)`;
        descEl.innerHTML = `A la natura no existeixen parelles aïllades! Milions de cations ${mInline(`\\text{${m.symbol}}^{${m.charge}+}`)} i anions ${mInline(`\\text{${nm.symbol}}^{${Math.abs(nm.charge)}-}`)} s'empaqueten en les tres direccions de l'espai mantenint la proporció <strong>${st.nMetal}:${st.nNonmetal}</strong> i formant una <strong>xarxa cristal·lina tridimensional</strong> gegant.`;
      }
    }

    function renderConfigs(m, nm) {
      const grid = document.getElementById('configs-grid');
      const isIon = state.step >= 5;

      const mCatSymbol = `\\text{${m.symbol}}^{${m.charge}+}`;
      const nmAnSymbol = `\\text{${nm.symbol}}^{${Math.abs(nm.charge)}-}`;

      grid.innerHTML = `
        <div class="config-card metal-card">
          <div class="config-header">
            <span class="config-title">${isIon ? `Catió ${m.name} (${mInline(mCatSymbol)})` : `Àtom de ${m.name} (${mInline(`\\text{${m.symbol}}`)})`}</span>
            <span class="badge-group">Metall · Grup ${m.group} · Z = ${m.z}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Configuració completa:</span>
            <span>${mInline(isIon ? m.ionFullConfig : m.fullConfig)}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Configuració abreujada:</span>
            <span>${mInline(isIon ? m.ionShortConfig : m.shortConfig)}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Distribució per capes:</span>
            <span>${isIon ? m.shells.slice(0, -1).join(' , ') + ` (${mInline(m.stableRule)})` : m.shells.join(' , ')}</span>
          </div>
        </div>

        <div class="config-card nonmetal-card">
          <div class="config-header">
            <span class="config-title">${isIon ? `Anió ${nm.name} (${mInline(nmAnSymbol)})` : `Àtom de ${nm.name} (${mInline(`\\text{${nm.symbol}}`)})`}</span>
            <span class="badge-group">No-metall · Grup ${nm.group} · Z = ${nm.z}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Configuració completa:</span>
            <span>${mInline(isIon ? nm.ionFullConfig : nm.fullConfig)}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Configuració abreujada:</span>
            <span>${mInline(isIon ? nm.ionShortConfig : nm.shortConfig)}</span>
          </div>
          <div class="config-row">
            <span class="config-label">Distribució per capes:</span>
            <span>${isIon ? [...nm.shells.slice(0, -1), 8].join(' , ') + ` (${mInline('\\text{octet}')})` : nm.shells.join(' , ')}</span>
          </div>
        </div>
      `;
    }

    /**
     * Renderitzat vectorial del model de Bohr, nombres d'oxidació individuals (Pas 5) i fórmula (Pas 6)
     */
    function renderSVG(m, nm, st) {
      if (activeAnimationId) {
        cancelAnimationFrame(activeAnimationId);
        activeAnimationId = null;
      }

      const svg = document.getElementById('bohr-svg');
      svg.innerHTML = '';

      if (state.step === 7) {
        renderCrystalLattice3D(svg, m, nm, st);
        return;
      }

      const countM = state.step <= 2 ? 1 : st.nMetal;
      const countNM = state.step <= 2 ? 1 : st.nNonmetal;

      const maxStack = Math.max(countM, countNM);
      const scale = maxStack === 3 ? 0.56 : (maxStack === 2 ? 0.74 : 0.90);

      const getAtomOffsets = (count, isMetal) => {
        if (count === 1) return [{ dx: 0, y: 192 }];
        if (count === 2) return [
          { dx: 0, y: 112 },
          { dx: 0, y: 272 }
        ];
        const shift = isMetal ? 58 : -58;
        return [
          { dx: -shift * 0.65, y: 80 },
          { dx: shift * 0.85,  y: 192 },
          { dx: -shift * 0.65, y: 304 }
        ];
      };

      const metalOffsets = getAtomOffsets(countM, true);
      const nonmetalOffsets = getAtomOffsets(countNM, false);

      // Calculem el desplaçament màxim cap endins (dx) de cada grup perquè MAI se solapin en acostar-se al Pas 6
      const maxMetalDx = Math.max(...metalOffsets.map(o => o.dx));
      const minNonmetalDx = Math.min(...nonmetalOffsets.map(o => o.dx));

      const sepMetalX = 215;
      const sepNonmetalX = 605;

      const mOuterIonR = getShellRadius(m.shells.length - 2, scale);
      const nmOuterIonR = getShellRadius(nm.shells.length - 1, scale);
      const safeGap = 24 * scale;
      const minCenterSeparation = (maxMetalDx - minNonmetalDx) + mOuterIonR + nmOuterIonR + safeGap;

      const centerMid = 410;
      const closeMetalX = centerMid - minCenterSeparation / 2;
      const closeNonmetalX = centerMid + minCenterSeparation / 2;

      const isStep6 = state.step === 6;
      const targetMetalX = isStep6 ? closeMetalX : sepMetalX;
      const targetNonmetalX = isStep6 ? closeNonmetalX : sepNonmetalX;

      const startMetalX = isStep6 ? sepMetalX : targetMetalX;
      const startNonmetalX = isStep6 ? sepNonmetalX : targetNonmetalX;

      const drawSceneAtPositions = (baseMetalX, baseNonmetalX, animProgress = 1) => {
        svg.innerHTML = '';

        const allTargetSlots = [];

        // 1. Dibuixar els NO-METALLS
        nonmetalOffsets.forEach((off, nmIndex) => {
          const nx = baseNonmetalX + off.dx;
          const ny = off.y;
          const outerRadius = getShellRadius(nm.shells.length - 1, scale);

          for (let slot = nm.valence; slot < 8; slot++) {
            const angle = getSlotAngle(slot, 8);
            allTargetSlots.push({
              x: nx + outerRadius * Math.cos(angle),
              y: ny + outerRadius * Math.sin(angle),
              nmIndex
            });
          }

          drawAtomBody(svg, {
            element: nm,
            cx: nx,
            cy: ny,
            scale,
            isMetal: false,
            step: state.step
          });

          // FASE 5: Etiqueta individual amb símbol + nombre d'oxidació a la dreta de cada anió, ben separada de l'escorça
          if (state.step === 5) {
            const labelX = nx + outerRadius + 56;
            drawIndividualOxBadge(svg, labelX, ny, nm.symbol, `${Math.abs(nm.charge)}−`, false);
          }
        });

        // 2. Dibuixar els METALLS
        metalOffsets.forEach((off) => {
          const mx = baseMetalX + off.dx;
          const my = off.y;
          const ionOuterRadius = getShellRadius(m.shells.length - 2, scale);

          drawAtomBody(svg, {
            element: m,
            cx: mx,
            cy: my,
            scale,
            isMetal: true,
            step: state.step
          });

          // FASE 5: Etiqueta individual amb símbol + nombre d'oxidació a l'esquerra de cada catió, ben separada de l'escorça
          if (state.step === 5) {
            const labelX = mx - ionOuterRadius - 56;
            drawIndividualOxBadge(svg, labelX, my, m.symbol, `${m.charge}+`, true);
          }
        });

        // 3. Dibuixar els electrons de valència del metall (sempre visibles en ambre)
        let globalValenceIdx = 0;
        metalOffsets.forEach((off) => {
          const mx = baseMetalX + off.dx;
          const my = off.y;
          const valShellIdx = m.shells.length - 1;
          const valRadius = getShellRadius(valShellIdx, scale);
          const slotCap = valShellIdx === 0 ? 2 : 8;

          for (let eIdx = 0; eIdx < m.valence; eIdx++) {
            const angle = getSlotAngle(eIdx, slotCap);
            const originX = mx + valRadius * Math.cos(angle);
            const originY = my + valRadius * Math.sin(angle);

            let ex = originX;
            let ey = originY;

            if (state.step >= 4) {
              const dest = allTargetSlots[globalValenceIdx];
              if (dest) {
                if (state.step === 4 && state.prevStep < 4) {
                  ex = originX + (dest.x - originX) * animProgress;
                  ey = originY + (dest.y - originY) * animProgress;
                } else {
                  ex = dest.x;
                  ey = dest.y;
                }
              }
            }
            globalValenceIdx++;

            if (state.step === 2 || state.step === 3) {
              const halo = createSVG('circle', {
                cx: ex, cy: ey, r: 9.5 * scale,
                fill: 'none',
                stroke: '#ef4444',
                'stroke-width': 1.6,
                class: 'vacancy-ring'
              });
              svg.appendChild(halo);
            }

            const electron = createSVG('circle', {
              cx: ex,
              cy: ey,
              r: 5.5 * scale,
              fill: 'var(--metal-color)',
              stroke: '#0f172a',
              'stroke-width': 1.1
            });
            svg.appendChild(electron);
          }
        });

        // 4. FASE 6: Atracció electrostàtica i FÓRMULA DEL COMPOST RESULTANT
        if (state.step === 6 && animProgress > 0.65) {
          const alpha = (animProgress - 0.65) / 0.35;
          const gAttr = createSVG('g', { opacity: alpha.toFixed(2) });

          const topW = 180;
          const topH = 26;
          gAttr.appendChild(createSVG('rect', {
            x: centerMid - topW / 2,
            y: 12,
            width: topW,
            height: topH,
            rx: 13,
            fill: 'rgba(239, 68, 68, 0.14)',
            stroke: '#ef4444',
            'stroke-width': 1.5
          }));
          const topLabel = createSVG('text', {
            x: centerMid,
            y: 29,
            'text-anchor': 'middle',
            fill: '#ef4444',
            'font-size': '12.5px',
            'font-weight': 'bold'
          });
          topLabel.textContent = '⚡ Atracció electrostàtica';
          gAttr.appendChild(topLabel);

          drawFormulaBanner(gAttr, centerMid, 362, m, nm, st);

          svg.appendChild(gAttr);
        }
      };

      const shouldAnimateTravel = (state.step === 4 && state.prevStep < 4);
      const shouldAnimateAttraction = (state.step === 6);

      if (shouldAnimateTravel || shouldAnimateAttraction) {
        const duration = 950;
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed = now - startTime;
          const rawT = Math.min(elapsed / duration, 1);
          const easeT = 1 - Math.pow(1 - rawT, 3);

          const curMX = startMetalX + (targetMetalX - startMetalX) * easeT;
          const curNMX = startNonmetalX + (targetNonmetalX - startNonmetalX) * easeT;

          drawSceneAtPositions(curMX, curNMX, easeT);

          if (rawT < 1) {
            activeAnimationId = requestAnimationFrame(tick);
          } else {
            activeAnimationId = null;
          }
        };

        activeAnimationId = requestAnimationFrame(tick);
      } else {
        drawSceneAtPositions(targetMetalX, targetNonmetalX, 1);
      }
    }

    /**
     * Dibuixa una targeta neta per a CADA catió/anió a la Fase 5, separada de l'escorça (ex: Na^{1+}, Cl^{1-})
     */
    function drawIndividualOxBadge(svg, cx, cy, symbol, oxStr, isMetal) {
      const g = createSVG('g', {});
      const boxW = 76;
      const boxH = 32;

      const bg = createSVG('rect', {
        x: cx - boxW / 2,
        y: cy - boxH / 2,
        width: boxW,
        height: boxH,
        rx: 8,
        fill: isMetal ? 'rgba(245, 158, 11, 0.16)' : 'rgba(6, 182, 212, 0.16)',
        stroke: isMetal ? 'var(--metal-color)' : 'var(--nonmetal-color)',
        'stroke-width': 1.7
      });
      g.appendChild(bg);

      const textEl = createSVG('text', {
        x: cx,
        y: cy + 6,
        'text-anchor': 'middle',
        fill: 'var(--text-main)',
        'font-weight': '800',
        'font-size': '17px'
      });

      const tspanSym = createSVG('tspan', {});
      tspanSym.textContent = symbol;

      const tspanOx = createSVG('tspan', {
        dy: '-6',
        'font-size': '13px',
        fill: isMetal ? '#ef4444' : '#2563eb'
      });
      tspanOx.textContent = oxStr;

      textEl.appendChild(tspanSym);
      textEl.appendChild(tspanOx);
      g.appendChild(textEl);

      svg.appendChild(g);
    }

    /**
     * Dibuixa a la Fase 6 la fórmula resultant amb l'intercanvi explícit (ex: Na1Cl1 = NaCl)
     */
    function drawFormulaBanner(container, cx, cy, m, nm, st) {
      const rawSubM = Math.abs(nm.charge);
      const rawSubNM = m.charge;

      const finalSubM = st.nMetal;
      const finalSubNM = st.nNonmetal;

      const needsSimplificationOrDropOne = (rawSubM === 1 || rawSubNM === 1 || rawSubM !== finalSubM || rawSubNM !== finalSubNM);

      const boxW = needsSimplificationOrDropOne ? 360 : 250;
      const boxH = 36;

      container.appendChild(createSVG('rect', {
        x: cx - boxW / 2,
        y: cy - boxH / 2,
        width: boxW,
        height: boxH,
        rx: 10,
        fill: 'var(--bg-subtle)',
        stroke: 'var(--primary)',
        'stroke-width': 1.8
      }));

      const txt = createSVG('text', {
        x: cx,
        y: cy + 6,
        'text-anchor': 'middle',
        fill: 'var(--text-main)',
        'font-size': '16px',
        'font-weight': 'bold'
      });

      const tPrefix = createSVG('tspan', { fill: 'var(--text-muted)', 'font-size': '13.5px', 'font-weight': '600' });
      tPrefix.textContent = 'Fórmula:   ';
      txt.appendChild(tPrefix);

      if (needsSimplificationOrDropOne) {
        const tM1 = createSVG('tspan', { fill: 'var(--metal-color)' });
        tM1.textContent = m.symbol;
        txt.appendChild(tM1);

        const tSubM1 = createSVG('tspan', { dy: '4', 'font-size': '12px', fill: 'var(--metal-color)' });
        tSubM1.textContent = rawSubM;
        txt.appendChild(tSubM1);

        const tNM1 = createSVG('tspan', { dy: '-4', fill: 'var(--nonmetal-color)' });
        tNM1.textContent = nm.symbol;
        txt.appendChild(tNM1);

        const tSubNM1 = createSVG('tspan', { dy: '4', 'font-size': '12px', fill: 'var(--nonmetal-color)' });
        tSubNM1.textContent = rawSubNM;
        txt.appendChild(tSubNM1);

        const tEq = createSVG('tspan', { dy: '-4', fill: 'var(--text-main)' });
        tEq.textContent = '  =  ';
        txt.appendChild(tEq);
      }

      const tM2 = createSVG('tspan', { fill: 'var(--metal-color)', 'font-size': '18px' });
      tM2.textContent = m.symbol;
      txt.appendChild(tM2);

      if (finalSubM > 1) {
        const tSubM2 = createSVG('tspan', { dy: '4', 'font-size': '13px', fill: 'var(--metal-color)' });
        tSubM2.textContent = finalSubM;
        txt.appendChild(tSubM2);
      }

      const tNM2 = createSVG('tspan', { dy: finalSubM > 1 ? '-4' : '0', fill: 'var(--nonmetal-color)', 'font-size': '18px' });
      tNM2.textContent = nm.symbol;
      txt.appendChild(tNM2);

      if (finalSubNM > 1) {
        const tSubNM2 = createSVG('tspan', { dy: '4', 'font-size': '13px', fill: 'var(--nonmetal-color)' });
        tSubNM2.textContent = finalSubNM;
        txt.appendChild(tSubNM2);
      }

      container.appendChild(txt);
    }

    function getShellRadius(shellIndex, scale) {
      return (33 + shellIndex * 23) * scale;
    }

    function getSlotAngle(slotIdx, total) {
      const pairAngles = [
        -Math.PI / 2 - 0.17, -Math.PI / 2 + 0.17,
        0 - 0.17, 0 + 0.17,
        Math.PI / 2 - 0.17, Math.PI / 2 + 0.17,
        Math.PI - 0.17, Math.PI + 0.17
      ];
      if (total === 8) return pairAngles[slotIdx % 8];
      if (total === 2) return slotIdx === 0 ? -Math.PI / 2 : Math.PI / 2;
      return (2 * Math.PI * slotIdx) / total - Math.PI / 2;
    }

    function drawAtomBody(svg, opts) {
      const { element, cx, cy, scale, isMetal, step } = opts;
      const g = createSVG('g', {});

      const shells = element.shells;
      const isIon = step >= 5;
      const visibleShellCount = (isMetal && isIon) ? shells.length - 1 : shells.length;

      // Nucli atòmic
      const nucleusR = 17.5 * scale;
      const nucColor = isMetal ? 'var(--metal-color)' : 'var(--nonmetal-color)';
      const nucleus = createSVG('circle', {
        cx, cy, r: nucleusR,
        fill: nucColor,
        opacity: '0.95'
      });
      g.appendChild(nucleus);

      const symText = createSVG('text', {
        x: cx, y: cy + (5 * scale),
        'text-anchor': 'middle',
        fill: '#0f172a',
        'font-weight': 'bold',
        'font-size': `${14.5 * scale}px`
      });
      symText.textContent = element.symbol;
      g.appendChild(symText);

      // Etiqueta circular de càrrega als passos 5 i 6
      if (isIon) {
        const chargeText = isMetal
          ? `${element.charge}+`
          : `${Math.abs(element.charge)}−`;

        const outerR = getShellRadius(visibleShellCount - 1, scale);
        const badgeX = cx + (isMetal ? -outerR - 14 * scale : outerR + 14 * scale);
        const badgeY = cy - outerR + 4 * scale;

        const badgeBg = createSVG('circle', {
          cx: badgeX, cy: badgeY - (4 * scale), r: 14 * scale,
          fill: isMetal ? '#ef4444' : '#2563eb'
        });
        const badgeLabel = createSVG('text', {
          x: badgeX, y: badgeY + (1 * scale),
          'text-anchor': 'middle',
          fill: '#ffffff',
          'font-weight': 'bold',
          'font-size': `${12.5 * scale}px`
        });
        badgeLabel.textContent = chargeText;
        g.appendChild(badgeBg);
        g.appendChild(badgeLabel);
      }

      // Capes electròniques
      for (let sIdx = 0; sIdx < visibleShellCount; sIdx++) {
        const r = getShellRadius(sIdx, scale);
        const isValenceShell = (sIdx === shells.length - 1);

        const orbit = createSVG('circle', {
          cx, cy, r,
          fill: 'none',
          stroke: 'var(--orbit-stroke)',
          'stroke-width': isValenceShell ? 1.8 : 1.2,
          'stroke-dasharray': (isMetal && isValenceShell && step === 4) ? '4,4' : 'none',
          opacity: (isMetal && isValenceShell && step === 4) ? '0.45' : '0.85'
        });
        g.appendChild(orbit);

        const eCount = shells[sIdx];
        const slotCapacity = sIdx === 0 ? 2 : (sIdx === 1 ? 8 : (isValenceShell ? 8 : eCount));

        if (!(isMetal && isValenceShell)) {
          for (let eIdx = 0; eIdx < eCount; eIdx++) {
            const angle = getSlotAngle(eIdx, slotCapacity);
            const ex = cx + r * Math.cos(angle);
            const ey = cy + r * Math.sin(angle);

            const electron = createSVG('circle', {
              cx: ex,
              cy: ey,
              r: (isValenceShell ? 5.1 : 4.1) * scale,
              fill: isMetal ? 'var(--metal-color)' : 'var(--nonmetal-color)',
              stroke: '#0f172a',
              'stroke-width': 1
            });
            g.appendChild(electron);
          }
        }

        // Buits discontinus al no-metall als passos 2 i 3
        if (!isMetal && isValenceShell && (step === 2 || step === 3)) {
          for (let vIdx = eCount; vIdx < 8; vIdx++) {
            const angle = getSlotAngle(vIdx, 8);
            const vx = cx + r * Math.cos(angle);
            const vy = cy + r * Math.sin(angle);

            const vacancy = createSVG('circle', {
              cx: vx, cy: vy, r: 5.4 * scale,
              fill: 'rgba(239, 68, 68, 0.15)',
              stroke: 'var(--vacancy-stroke)',
              'stroke-width': 1.8,
              'stroke-dasharray': '3,2',
              class: 'vacancy-ring'
            });
            g.appendChild(vacancy);
          }
        }
      }

      svg.appendChild(g);
    }

    /**
     * Dibuix de la xarxa cristal·lina iònica TRIDIMENSIONAL en PERSPECTIVA CAVALLERA (Pas 7)
     */
    function renderCrystalLattice3D(svg, m, nm, st) {
      const g = createSVG('g', {});

      const defs = createSVG('defs', {});
      defs.innerHTML = `
        <radialGradient id="grad-cation" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fde68a"/>
          <stop offset="45%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#b45309"/>
        </radialGradient>
        <radialGradient id="grad-anion" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#a5f3fc"/>
          <stop offset="45%" stop-color="#06b6d4"/>
          <stop offset="100%" stop-color="#0e7490"/>
        </radialGradient>
      `;
      svg.appendChild(defs);

      const catCharge = `${m.charge}+`;
      const anCharge = `${Math.abs(nm.charge)}−`;

      const title = createSVG('text', {
        x: 410, y: 26, 'text-anchor': 'middle',
        fill: 'var(--text-main)', 'font-weight': 'bold', 'font-size': '15px'
      });
      title.textContent = `Xarxa cristal·lina 3D en perspectiva cavallera · Proporció ${st.nMetal}:${st.nNonmetal} (${m.symbol}${st.nMetal > 1 ? st.nMetal : ''}${nm.symbol}${st.nNonmetal > 1 ? st.nNonmetal : ''})`;
      g.appendChild(title);

      const angleCav = (38 * Math.PI) / 180;
      const kCav = 0.58;
      const cosCav = Math.cos(angleCav) * kCav;
      const sinCav = Math.sin(angleCav) * kCav;

      let nodes3D = [];
      let spacingX = 72, spacingY = 66, spacingZ = 72;
      let maxNeighborDist = 85;

      if (st.nMetal === 1 && st.nNonmetal === 1) {
        const nx = 4, ny = 3, nz = 2;
        spacingX = 82; spacingY = 74; spacingZ = 82;
        maxNeighborDist = 90;
        for (let ix = 0; ix < nx; ix++) {
          for (let iy = 0; iy < ny; iy++) {
            for (let iz = 0; iz < nz; iz++) {
              nodes3D.push({
                x: ix * spacingX,
                y: iy * spacingY,
                z: iz * spacingZ,
                isCation: (ix + iy + iz) % 2 === 0
              });
            }
          }
        }
      } else if ((st.nMetal === 1 && st.nNonmetal === 2) || (st.nMetal === 2 && st.nNonmetal === 1)) {
        const majorityIsCation = (st.nMetal === 2);
        spacingX = 115; spacingZ = 115;
        maxNeighborDist = 85;
        for (let ix = 0; ix < 3; ix++) {
          for (let iz = 0; iz < 2; iz++) {
            const cx = ix * spacingX;
            const cz = iz * spacingZ;
            const cy = 65;
            nodes3D.push({ x: cx, y: cy, z: cz, isCation: !majorityIsCation });
            nodes3D.push({ x: cx - 36, y: cy - 42, z: cz - 28, isCation: majorityIsCation });
            nodes3D.push({ x: cx + 36, y: cy + 42, z: cz + 28, isCation: majorityIsCation });
          }
        }
      } else if ((st.nMetal === 3 && st.nNonmetal === 1) || (st.nMetal === 1 && st.nNonmetal === 3)) {
        const majorityIsCation = (st.nMetal === 3);
        spacingX = 135; spacingZ = 120;
        maxNeighborDist = 92;
        for (let ix = 0; ix < 3; ix++) {
          for (let iz = 0; iz < 2; iz++) {
            const cx = ix * spacingX;
            const cz = iz * spacingZ;
            const cy = 68;
            nodes3D.push({ x: cx, y: cy, z: cz, isCation: !majorityIsCation });
            nodes3D.push({ x: cx - 44, y: cy - 36, z: cz - 24, isCation: majorityIsCation });
            nodes3D.push({ x: cx + 44, y: cy - 36, z: cz + 24, isCation: majorityIsCation });
            nodes3D.push({ x: cx,      y: cy + 50, z: cz,      isCation: majorityIsCation });
          }
        }
      } else {
        spacingX = 165; spacingZ = 135;
        maxNeighborDist = 96;
        for (let ix = 0; ix < 2; ix++) {
          for (let iz = 0; iz < 2; iz++) {
            const cx = ix * spacingX;
            const cz = iz * spacingZ;
            const cy = 70;
            nodes3D.push({ x: cx - 38, y: cy, z: cz - 18, isCation: false });
            nodes3D.push({ x: cx + 38, y: cy, z: cz + 18, isCation: false });
            nodes3D.push({ x: cx,      y: cy - 52, z: cz,      isCation: true });
            nodes3D.push({ x: cx - 58, y: cy + 48, z: cz + 26, isCation: true });
            nodes3D.push({ x: cx + 58, y: cy + 48, z: cz - 26, isCation: true });
          }
        }
      }

      const projected = nodes3D.map((n, idx) => {
        const px = n.x + n.z * cosCav;
        const py = n.y - n.z * sinCav;
        return { ...n, idx, px, py };
      });

      const minX = Math.min(...projected.map(p => p.px));
      const maxX = Math.max(...projected.map(p => p.px));
      const minY = Math.min(...projected.map(p => p.py));
      const maxY = Math.max(...projected.map(p => p.py));

      const offsetX = 410 - (minX + maxX) / 2;
      const offsetY = 200 - (minY + maxY) / 2;

      projected.forEach(p => {
        p.sx = p.px + offsetX;
        p.sy = p.py + offsetY;
      });

      projected.sort((a, b) => b.z - a.z || a.y - b.y);

      for (let i = 0; i < projected.length; i++) {
        for (let j = i + 1; j < projected.length; j++) {
          const a = projected[i];
          const b = projected[j];
          if (a.isCation !== b.isCation) {
            const dist3D = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
            if (dist3D <= maxNeighborDist) {
              const avgZ = (a.z + b.z) / 2;
              const isFront = avgZ < 60;
              g.appendChild(createSVG('line', {
                x1: a.sx, y1: a.sy,
                x2: b.sx, y2: b.sy,
                stroke: 'var(--orbit-stroke)',
                'stroke-width': isFront ? 2.1 : 1.3,
                'stroke-dasharray': isFront ? 'none' : '4,3',
                opacity: isFront ? '0.75' : '0.45'
              }));
            }
          }
        }
      }

      let catCount = 0;
      let anCount = 0;

      projected.forEach(p => {
        if (p.isCation) catCount++;
        else anCount++;

        const depthFactor = p.z > 60 ? 0.90 : 1.04;
        const radius = (p.isCation ? 17.5 : 23.5) * depthFactor;
        const fillUrl = p.isCation ? 'url(#grad-cation)' : 'url(#grad-anion)';
        const label = p.isCation ? `${m.symbol}${catCharge}` : `${nm.symbol}${anCharge}`;

        const sphere = createSVG('circle', {
          cx: p.sx,
          cy: p.sy,
          r: radius,
          fill: fillUrl,
          stroke: 'rgba(15, 23, 42, 0.45)',
          'stroke-width': 1.2
        });
        g.appendChild(sphere);

        const txt = createSVG('text', {
          x: p.sx,
          y: p.sy + 4,
          'text-anchor': 'middle',
          fill: '#0f172a',
          'font-weight': 'bold',
          'font-size': `${(p.isCation ? 10 : 11) * depthFactor}px`
        });
        txt.textContent = label;
        g.appendChild(txt);
      });

      const axX = 55, axY = 355;
      const gAxes = createSVG('g', { opacity: '0.75' });
      gAxes.appendChild(createSVG('line', { x1: axX, y1: axY, x2: axX + 26, y2: axY, stroke: 'var(--text-muted)', 'stroke-width': 1.5 }));
      gAxes.appendChild(createSVG('line', { x1: axX, y1: axY, x2: axX, y2: axY - 26, stroke: 'var(--text-muted)', 'stroke-width': 1.5 }));
      gAxes.appendChild(createSVG('line', { x1: axX, y1: axY, x2: axX + 18, y2: axY - 14, stroke: 'var(--text-muted)', 'stroke-width': 1.5 }));
      const axLbl = createSVG('text', { x: axX + 32, y: axY + 3, fill: 'var(--text-muted)', 'font-size': '10.5px' });
      axLbl.textContent = '3D (X, Y, Z)';
      gAxes.appendChild(axLbl);
      g.appendChild(gAxes);

      const note = createSVG('text', {
        x: 435, y: 374, 'text-anchor': 'middle',
        fill: 'var(--text-muted)', 'font-size': '12.5px'
      });
      note.textContent = `Bloc cristal·lí 3D amb ${catCount} cations (${m.symbol}${catCharge}) i ${anCount} anions (${nm.symbol}${anCharge}) → Proporció exacta ${st.nMetal}:${st.nNonmetal}.`;
      g.appendChild(note);

      svg.appendChild(g);
    }

    function createSVG(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }
  </script>
</body>
